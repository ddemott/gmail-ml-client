[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-ml-client"
version = "0.1.0"
description = "A machine learning-powered Gmail client for intelligent email management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gmail ML Client Team", email = "team@example.com"},
]
maintainers = [
    {name = "Gmail ML Client Team", email = "team@example.com"},
]
keywords = ["email", "gmail", "machine-learning", "automation", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "absl-py>=2.3.0",
    "annotated-types>=0.7.0",
    "anyio>=3.7.0",
    "click>=8.3.0",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.143.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "joblib>=1.5.0",
    "keras>=3.11.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "rich>=13.9.0",
    "scikit-learn>=1.5.0",
    "SQLAlchemy>=2.0.0",
    "tensorflow-cpu>=2.17.0",
    "typer>=0.12.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "bandit>=1.8.0",
    "safety>=3.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.15.0",
]

[project.urls]
Homepage = "https://github.com/ddemott/gmail-ml-client"
Documentation = "https://gmail-ml-client.readthedocs.io/"
Repository = "https://github.com/ddemott/gmail-ml-client"
Issues = "https://github.com/ddemott/gmail-ml-client/issues"
Changelog = "https://github.com/ddemott/gmail-ml-client/blob/main/CHANGELOG.md"

[project.scripts]
gmail-ml-client = "cli_fixed:main"
gmail_client = "cli_fixed:main"

# Tool configurations
[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
  | \.pytest_cache
  | htmlcov
  | model_artifacts
  | logs
  | react-example
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["gmail_ml_client"]
skip = ["__init__.py", ".git", ".tox", "build", "dist", "__pycache__", ".pytest_cache", "htmlcov"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]  # assert false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "tensorflow.*",
    "keras.*",
    "google.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests", "."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
